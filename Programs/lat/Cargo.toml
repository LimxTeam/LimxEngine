[package]
name = "lat"
description = "Limx Asset Tool - 纹理离线烘焙 (BC 压缩 + mip 链 + DDS 输出)"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true

[[bin]]
name = "lat"
path = "src/main.rs"

[dependencies]
clap.workspace = true
anyhow.workspace = true
thiserror.workspace = true
walkdir.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
tracing-appender.workspace = true
rayon.workspace = true
indicatif = "0.17"
console = "0.15"

# BC 块压缩。
# 关掉 default-features 是关键: 默认会拉进 wgpu (GPU compute 路径) 和 bc6h 依赖的 half。
# 我们只要 bc15 = BC1..BC5 的纯 CPU 编码器 + decode 模块, 该 feature 的依赖列表是空的,
# 因此整条链路只剩 bytemuck, 没有 build.rs, 没有 C/C++ 依赖 —— 和 lsc 依赖的
# shaderc-sys (现场编译 glslang) 相比轻得多。
block_compression = { version = "0.10", default-features = false, features = ["bc15"] }

# 源图解码。同样关掉 default-features:
# 默认会拉进 avif(dav1d)/webp/tiff/exr 等一大堆格式, 其中 ravif 走 nasm。
# Sponza 只有 jpeg 和 png, 按需开这两个即可。
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
