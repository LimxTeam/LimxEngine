[module]
name        = "LimxRenderCore"
type        = "static"
namespace   = "Limx"
api_macro   = "LIMX_RENDERCORE_API"
layer       = 3
description = "渲染核心模块 — 渲染上下文 (交换链+帧同步) 和着色器管理器 (SPIR-V 加载+缓存)，提供渲染基础设施"

[dependencies]
public  = ["LimxCore", "LimxRHI", "LimxApplicationCore"]
private = []

[sources]
include_dirs = ["Public"]
private_dirs = ["Private"]
exclude      = ["*.generated.*"]

[compile]
defines       = ["LIMX_RENDERCORE_EXPORTS"]
features      = []
flags         = []
include_paths = []
library_paths = []
libraries     = []

[precompiled_header]
enabled = true
header  = "RenderCore/RenderCoreMinimal.h"

[reflection]
enabled = false
macros  = []
