# ============================================================
# Limx Engine 持续集成
#
# ── 两层 ────────────────────────────────────────────────────
#
# 无 GPU 层 (toolchain / shaders / engine)
#   Rust 工具链、着色器编译与校验、源码规则、C++ 全量构建、单元测试。
#   只需要 CPU 与 Vulkan SDK (头文件与 glslang), 普通托管运行器即可。
#   这一层全绿是一个**可信的完整结论**, 而不是"有几步跑不了"。
#
# 需 GPU 层 (gpu-checks)
#   显存回收自检、IBL 白炉自检、G-Buffer 自检 (法线编码 + 速度矢量)、
#   交换链重建自检、资产导入回归哨兵。
#   它们要创建真实 VkDevice 并提交命令 —— 托管运行器只有软件光栅化器
#   (甚至没有 Vulkan 设备), 跑不了。该作业指定 self-hosted + gpu 标签,
#   在没有这类运行器时不会排队阻塞, 也不会伪装成通过。
#
# 分层的意义: 把跑不了的步骤混在必跑作业里, 结果是"红了但据说没关系",
# 这种状态维持不了几周就会让整个 CI 被当成噪声。
#
# ── 软件光栅化器 (lavapipe): 实测结论 ─────────────────────────────────
#
# 装了 Mesa 26.2.0 的 lavapipe (llvmpipe) 实测过一轮。三条结论:
#
# 1) **它支持光追与网格着色器。** 这一条推翻了先前那句"lavapipe 不支持,
#    那 10 步无论如何要真实硬件"。实测 lavapipe 报告 VK_KHR_ray_query、
#    VK_KHR_acceleration_structure 与 VK_EXT_mesh_shader 全部可用, 引擎
#    也照常把两条路径都打开了:
#
#      [Vulkan] 网格着色器 — 扩展:true meshShader:true taskShader:true → 启用
#      [Vulkan] 光追 — 扩展齐备:true ... rayQuery 特性:true → 启用
#
#    先前那句是照着"软件光栅化器不会有这些"想当然写的, 没有量过。
#
# 2) **设备、管线、命令录制全都过得去。** 引擎在 lavapipe 上能选到设备、
#    建出全部管线 (含光追与网格着色器)、把一整帧的十六个通道全部录完。
#
# 3) **执行那一步崩。** 命令缓冲区提交之后进程直接访问违例 (0xC0000005),
#    第一帧就崩。已经排除的:
#
#      不是 WSI          同一个 ICD 上 SDK 自带的 vkcube 正常呈现五帧
#      不是呈现          把 vkQueuePresentKHR 整个跳过, 照样在执行时崩
#      不是光追/网格     两个特性都强制关掉, 照样崩
#      不是并行录制      --no-parallel-record 照样崩
#      不是剔除/分簇     --no-cull --no-clustered 照样崩
#      验证层是哑的      核心检查与 GPU 辅助验证都没有任何输出
#
#    也就是说: 有一条我们发出去的命令 (或某个着色器) 会让 llvmpipe 崩,
#    而 NVIDIA 上跑得好好的。这是一个真实的可移植性缺陷, 不是"软件光栅化
#    器不行"。
#
# **所以 CI 这一层还是没做。** 缺的不再是那个下载, 是把上面第 3 条查到底 ——
# 那需要同时有我们和 llvmpipe 的符号去看栈。按通道数截断来二分是行不通的
# (截断会先触发引擎自己的断言, 退出码是 STATUS_BREAKPOINT 而不是访问违例),
# 得改成逐个关通道。
#
# 做的时候顺序: 定位那条命令 -> 修 (十有八九是我们这边某处依赖了 NVIDIA
# 的宽容) -> 再按实测能过的步数给需 GPU 层加 software-raster 作业。
#
# 复现用的 ICD 装法 (不改系统, 只设一个环境变量):
#
#   下载 mesa3d-<版本>-release-msvc.7z (pal1000/mesa-dist-win 的 release)
#   解出 x64/vulkan_lvp.dll 与 x64/lvp_icd.x86_64.json 到同一个目录
#   set VK_DRIVER_FILES=<那个目录>\lvp_icd.x86_64.json
#
# ── 说明 ────────────────────────────────────────────────────
#
# 该工作流尚未在真实 GitHub Actions 环境中验证过。仓库已于 2026-08-29
# 推送到 LimxTeam/LimxEngine, 首次触发后需重点检查 Vulkan SDK 安装步骤
# 与运行器镜像的兼容性。
#
# Source/ThirdParty 不入库, 但这不影响构建 —— 两个 SDK 是 External 类型
# 模块且无引擎模块依赖, 已实测确认。
#
# 本地等价验证:
#   pwsh Scripts/verify.ps1 -SkipGpu    # 对应无 GPU 层
#   pwsh Scripts/verify.ps1 -OnlyGpu    # 对应需 GPU 层
# ============================================================

name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

env:
  VULKAN_SDK_VERSION: "1.4.350.0"
  CARGO_TERM_COLOR: always

jobs:
  # ==========================================================
  # 无 GPU 层
  # ==========================================================

  # ----------------------------------------------------------
  # Rust 工具链 — 不依赖 GPU, 可独立快速反馈
  # ----------------------------------------------------------
  toolchain:
    name: Rust 工具链
    runs-on: windows-2022

    steps:
      - uses: actions/checkout@v4

      - name: 安装 Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: 缓存 Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            Programs/target
          key: cargo-${{ runner.os }}-${{ hashFiles('Programs/Cargo.lock') }}

      # lsc 依赖 shaderc-sys, 需要 Vulkan SDK 提供的 glslang。
      # 这是编译期依赖, 不需要 GPU。
      - name: 安装 Vulkan SDK
        uses: jakoch/install-vulkan-sdk-action@v1
        with:
          vulkan_version: ${{ env.VULKAN_SDK_VERSION }}
          install_runtime: true
          cache: true

      - name: 检查
        working-directory: Programs
        run: cargo check --workspace --all-targets

      - name: 测试
        working-directory: Programs
        run: cargo test --workspace

      - name: 构建发布版
        working-directory: Programs
        run: cargo build --workspace --release

      - name: 上传工具链
        uses: actions/upload-artifact@v4
        with:
          name: limx-toolchain
          path: |
            Programs/target/release/lbt.exe
            Programs/target/release/lht.exe
            Programs/target/release/lsc.exe
            Programs/target/release/lat.exe

  # ----------------------------------------------------------
  # C++ 引擎 — 源码规则 + 全量构建 + 单元测试
  #
  # 这里的每一步都是控制台程序, PowerShell 会等待它们并回填
  # $LASTEXITCODE, 因此 run: 直接调用即可, 退出码非 0 即失败。
  # 引擎可执行文件 (GUI 子系统) 不在这一层 —— 见 gpu-checks 的说明。
  # ----------------------------------------------------------
  engine:
    name: 引擎构建与测试
    runs-on: windows-2022
    needs: toolchain

    steps:
      - uses: actions/checkout@v4

      - name: 安装 Vulkan SDK
        uses: jakoch/install-vulkan-sdk-action@v1
        with:
          vulkan_version: ${{ env.VULKAN_SDK_VERSION }}
          install_runtime: true
          cache: true

      - name: 配置 MSVC 环境
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: 下载工具链
        uses: actions/download-artifact@v4
        with:
          name: limx-toolchain
          path: Binaries/Tools

      # Vulkan 加载器必须在 exe 旁边或 PATH 上。
      #
      # LimxEngineTests 经 LimxRenderer/LimxRenderCore **静态导入**
      # vulkan-1.dll。加载器找不到它时进程根本起不来 (0xC0000135), 而在
      # CI 上这表现为"引擎层测试失败" —— 实际一条断言都没跑到。
      #
      # 对比: LimxCoreTests / LimxRHITests 只导入 KERNEL32 与 CRT, 所以
      # 它们一直是绿的, 这个问题因此被掩盖着。
      #
      # 更彻底的做法是运行时 LoadLibrary 而非静态导入 —— 那样没有显卡的
      # 环境也能跑纯 CPU 的用例。已记入 RHI 补齐那条副线。
      - name: 准备 Vulkan 加载器
        shell: pwsh
        run: |
          $candidates = @(
            (Join-Path $env:VULKAN_SDK 'Bin/vulkan-1.dll'),
            (Join-Path $env:VULKAN_SDK 'runtime/x64/vulkan-1.dll'),
            (Join-Path $env:SystemRoot 'System32/vulkan-1.dll')
          )
          $found = $candidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $found) {
            Write-Host '候选路径均不存在:'
            $candidates | ForEach-Object { Write-Host "  $_" }
            throw '未找到 vulkan-1.dll'
          }
          Write-Host "使用 $found"
          $dest = 'Binaries/Development/Win64'
          New-Item -ItemType Directory -Force $dest | Out-Null
          Copy-Item $found $dest -Force

      # 零 STL / 零 CRT / 无裸 new-delete 等强制规则。
      # lbt check 在发现 Error 级别问题时以 1 退出 (第四周修复, 在此之前
      # 它只打印不返回, 这一步从未真正拦住过任何东西)。
      - name: 源码规则检查
        run: .\Binaries\Tools\lbt.exe check --source-dir Source

      - name: 模块配置校验
        run: .\Binaries\Tools\lbt.exe validate -s Source --strict

      # verify.ps1 与本文件跑同一件事时参数必须逐字相同。
      #
      # Day 1 实测发现两处分歧 (validate 的 --strict、build 的 --skip-shaders),
      # 两处都会让"本地全绿而 CI 失败"。这种分歧在真正触发 CI 之前看不见,
      # 所以把它变成一条本地就能跑的检查。
      - name: CI 等价性
        run: pwsh Scripts/ci-parity.ps1

      # 命令必须与 verify.ps1 逐字相同 —— Scripts/ci-parity.ps1 会校验这一点。
      #
      # --skip-shaders: 着色器由 shaders 作业单独编译与校验, 这里再编一遍
      # 只是重复。engine 作业的产物因此不含 SPIR-V, gpu-checks 会同时下载
      # shaders 作业的产物。
      - name: 构建
        run: .\Binaries\Tools\lbt.exe build -s Source -c development --skip-shaders

      # 退出码非 0 即判定失败, 无需解析输出文本
      - name: Core 单元测试
        run: .\Binaries\Development\Win64\LimxCoreTests.exe --min-cases 406

      - name: RHI 单元测试
        run: .\Binaries\Development\Win64\LimxRHITests.exe --min-cases 58

      - name: 资产管线单元测试
        run: .\Binaries\Development\Win64\LimxAssetTests.exe --min-cases 200

      # 引擎层测试逐套件跑。
      #
      # 不是为了好看: 作业日志需要仓库 admin 权限才能读, 而**步骤的成败
      # 是公开可查的**。拆成逐套件之后, 哪个套件失败可以直接从步骤名看出来,
      # 不必等人去翻日志。
      #
      # 这条路是被逼出来的 —— 该测试在本地和干净克隆里都通过, 只在 CI 上
      # 失败, 而失败原因看不到。
      # 启动探针 —— 只列举用例, 不执行任何断言。
      #
      # 用来区分两种完全不同的失败: 进程根本起不来 (加载失败、静态初始化
      # 崩溃), 还是某条断言真的不成立。BlendMode 那几条是纯枚举往返, 不
      # 可能因机器不同而失败, 所以更像是前者 —— 而它恰好是第一个步骤。
      - name: 引擎层测试 · 启动探针
        run: .\Binaries\Development\Win64\LimxEngineTests.exe --list

      - name: 引擎层测试 · BlendMode
        run: .\Binaries\Development\Win64\LimxEngineTests.exe --suite BlendMode

      - name: 引擎层测试 · CascadeSplit
        run: .\Binaries\Development\Win64\LimxEngineTests.exe --suite CascadeSplit

      - name: 引擎层测试 · GeometryWinding
        run: .\Binaries\Development\Win64\LimxEngineTests.exe --suite GeometryWinding

      - name: 引擎层测试 · LSpatialTrait
        run: .\Binaries\Development\Win64\LimxEngineTests.exe --suite LSpatialTrait

      - name: 引擎层测试 · TranslucentSort
        run: .\Binaries\Development\Win64\LimxEngineTests.exe --suite TranslucentSort

      - name: 引擎层测试 · ClusterGrid
        run: .\Binaries\Development\Win64\LimxEngineTests.exe --suite ClusterGrid

      - name: 引擎层测试 · CompressedTextureFormat
        run: .\Binaries\Development\Win64\LimxEngineTests.exe --suite CompressedTextureFormat

      - name: 引擎层测试 · Octahedral
        run: .\Binaries\Development\Win64\LimxEngineTests.exe --suite Octahedral

      - name: 引擎层测试 · ShadowAtlas
        run: .\Binaries\Development\Win64\LimxEngineTests.exe --suite ShadowAtlas

      # 用例数下限 —— 防的是"套件悄悄消失"。
      #
      # 上面每一条都是手写的套件名。新加一个套件而忘了补一行, 它就永远不会
      # 被执行, 而"没执行"与"全过"在退出码上完全一样。ClusterGrid、
      # Octahedral、ShadowAtlas 三个就是这么漏掉的。
      #
      # 判据放在二进制里而不是脚本里: 脚本要判断就得解析输出文本, 而解析
      # 失败会退化成"没发现问题" —— 又一个落在"通过"上的失效。
      - name: 引擎层测试 · 用例数下限
        run: .\Binaries\Development\Win64\LimxEngineTests.exe --min-cases 85

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: limx-engine-build
          path: Binaries/Development/Win64/
          retention-days: 3

      - name: 上传失败日志
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: Logs/

  # ----------------------------------------------------------
  # 着色器 — 编译 + SPIR-V 校验
  # ----------------------------------------------------------
  shaders:
    name: 着色器编译
    runs-on: windows-2022
    needs: toolchain

    steps:
      - uses: actions/checkout@v4

      - name: 安装 Vulkan SDK
        uses: jakoch/install-vulkan-sdk-action@v1
        with:
          vulkan_version: ${{ env.VULKAN_SDK_VERSION }}
          install_runtime: true
          cache: true

      - name: 下载工具链
        uses: actions/download-artifact@v4
        with:
          name: limx-toolchain
          path: Binaries/Tools

      - name: 编译着色器
        run: .\Binaries\Tools\lsc.exe compile-all -s Shaders -o Binaries/Shaders --vulkan-version 1.4 -O

      - name: 严格校验
        run: .\Binaries\Tools\lsc.exe validate -s Shaders --vulkan-version 1.4 --strict

      # C++ 结构体与 SPIR-V 布局的一致性。放在这个作业是因为它要的两样
      # 东西都在这里: 刚产出的反射 JSON, 和仓库里的 C++ 头文件。
      #
      # 与 verify.ps1 调的是同一个脚本, 不是两份各写一遍的判据。
      - name: C++ 结构体与 SPIR-V 布局一致
        run: pwsh Scripts/verify-shader-layout.ps1

      # gpu-checks 要跑真实引擎, 而引擎需要编译好的 SPIR-V。
      # engine 作业用 --skip-shaders 构建, 所以着色器只能从这里来。
      - name: 上传着色器
        uses: actions/upload-artifact@v4
        with:
          name: limx-shaders
          path: Binaries/Shaders/
          retention-days: 3

  # ==========================================================
  # 需 GPU 层
  # ==========================================================
  #
  # 这些步骤要创建真实 VkDevice。托管运行器给不了, 所以指定
  # self-hosted + gpu 标签; 没有这类运行器时该作业不会开始, 也就
  # 不会用一个假的绿色掩盖"没验过"。
  #
  # ── 为什么必须走 verify.ps1 而不是直接 run: ──
  #
  # LimxLaunch.exe 是 GUI 子系统程序 (PE Subsystem = 2)。PowerShell
  # 调用 GUI 程序时**不等待、也不回填 $LASTEXITCODE** —— 直接写成
  # `run: .\LimxLaunch.exe --furnace-check` 的话, 这一步会在进程刚启动
  # 时就以成功返回, 哪怕自检全项失败、哪怕进程立刻崩溃。
  #
  # verify.ps1 的 Invoke-Engine 用 Start-Process -Wait -PassThru 并显式
  # 取 ExitCode, 这是唯一被实测验证过能如实报告失败的调用方式。
  gpu-checks:
    name: GPU 自检 (需真实显卡)
    runs-on: [self-hosted, windows, gpu]
    needs: [engine, shaders]
    # 没有 self-hosted GPU 运行器时, 该作业排队但不阻塞其它作业;
    # 手动触发或打了 gpu 标签的分支才尝试运行。
    if: >-
      github.event_name == 'workflow_dispatch' ||
      contains(github.event.pull_request.labels.*.name, 'gpu')

    steps:
      - uses: actions/checkout@v4

      - name: 安装 Vulkan SDK
        uses: jakoch/install-vulkan-sdk-action@v1
        with:
          vulkan_version: ${{ env.VULKAN_SDK_VERSION }}
          install_runtime: true
          cache: true

      - name: 下载引擎产物
        uses: actions/download-artifact@v4
        with:
          name: limx-engine-build
          path: Binaries/Development/Win64

      - name: 下载着色器
        uses: actions/download-artifact@v4
        with:
          name: limx-shaders
          path: Binaries/Shaders

      # 清单见文件头的"需 GPU 层"一节。不在这里重复列举 —— 重复的清单
      # 只会有一份跟得上实际, 而看的人分不出哪份是对的。
      - name: GPU 自检
        run: pwsh Scripts/verify.ps1 -OnlyGpu

      - name: 上传失败日志
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gpu-logs
          path: Logs/
