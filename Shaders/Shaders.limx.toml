# ============================================================
# Shaders.limx.toml — Limx 着色器构建配置
# 等价于 UE5 Engine/Shaders/Shaders.Build.cs
#
# LBT 构建时调用 LSC 编译着色器:
#   lsc compile-all -s Shaders/ -o Binaries/Shaders/ -O
#
# 着色器源码目录结构 (Shaders/) 与编译输出 (Binaries/Shaders/)
# 保持镜像关系，运行时 FShaderManager 按名称索引。
# ============================================================

[shaders]
# 着色器源码根目录 (相对于引擎根)
source_dir = "Shaders"

# 编译输出目录 (相对于引擎根)
output_dir = "Binaries/Shaders"

# 目标 Vulkan 版本
vulkan_version = "1.3"

# 发布模式启用优化
optimize = true

# 默认入口点
entry_point = "main"

# ---- 着色器组 ----
# 每个组对应一个子目录，LBT/LSC 按组编译

[[groups]]
name = "Builtin"
path = "Builtin"
description = "引擎内置基础着色器 (几何体、光照、纹理)"
extensions = ["vert", "frag", "comp"]

# [[groups]]
